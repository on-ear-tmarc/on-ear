<title>ON-EAR 2026 Program</title>
<style>
:root {
  --paper: #f3f5f6; --surface: #ffffff; --surface-2: #e9eef0; --line: #dbe2e5;
  --ink: #16242a; --muted: #56656c; --faint: #85939a;
  --accent: #121b8a; --accent-soft: #e7e9f8; --accent-ink: #0b1268;
  --live: #a85a00; --live-soft: #fff0dc; --live-dot: #ffa12d; --star: #f29318;
  --t-talk: #121b8a; --t-insight: #2f7fb5; --t-keynote: #7a3fb0; --t-poster: #c46f00;
  --t-break: #9aa6ab; --t-meal: #9aa6ab; --t-ceremony: #56656c; --t-demo: #4b8a3e; --t-social: #0f7c74;
  --shadow: 0 1px 2px rgba(22,36,42,.05), 0 8px 24px rgba(22,36,42,.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10181b; --surface: #182327; --surface-2: #213036; --line: #2c3c42;
    --ink: #e7eef0; --muted: #a2b2b8; --faint: #73858c;
    --accent: #a3abff; --accent-soft: #242a58; --accent-ink: #c9ceff;
    --live: #ffbf6e; --live-soft: #3a2a15; --star: #ffb14d;
    --t-talk: #a3abff; --t-insight: #7db8e3; --t-keynote: #c39cf0; --t-poster: #ffb14d; --t-social: #5fd0c4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --paper: #10181b; --surface: #182327; --surface-2: #213036; --line: #2c3c42;
  --ink: #e7eef0; --muted: #a2b2b8; --faint: #73858c;
  --accent: #a3abff; --accent-soft: #242a58; --accent-ink: #c9ceff;
  --live: #ffbf6e; --live-soft: #3a2a15; --star: #ffb14d;
  --t-talk: #a3abff; --t-insight: #7db8e3; --t-keynote: #c39cf0; --t-poster: #ffb14d; --t-social: #5fd0c4;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { max-width: 620px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.head { position: sticky; top: 0; z-index: 20; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; }
.brand { margin-right: auto; line-height: 1.2; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { display: block; height: 36px; width: auto; background: #fff; border-radius: 6px; padding: 2px 4px; }
.brand span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.brand span b { display: block; color: var(--ink); font-size: 13px; }
@media (max-width: 380px) { .brand span { display: none; } }
.sponsors { margin: 28px 0 8px; text-align: center; }
.sponsors h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 84px; padding: 12px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; color: #16242a; text-decoration: none; font-weight: 600; font-size: 14px; }
.stile img { max-width: 100%; max-height: 56px; object-fit: contain; }
.stile small { font-weight: 400; color: #56656c; font-size: 12px; }
.stile.ph { background: transparent; border-style: dashed; color: var(--faint); font-weight: 500; }
.stext { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.6; }
.sponsors .note { font-size: 12px; color: var(--faint); margin-top: 8px; }

.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 36px; height: 36px; font-size: 16px; }
main { flex: 1; padding: 16px 16px 40px; padding-bottom: max(40px, env(safe-area-inset-bottom)); }
.view { display: none; } .view.active { display: block; }

/* tabs sit at the top under the title on every screen (in the sticky header, so always visible) – 2026-11-10 */
.tabbar { display: flex; justify-content: center; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabbar .in { display: flex; width: 100%; max-width: 620px; }
.tab { flex: 1; border: 0; background: none; padding: 10px 0; font-size: 13px; color: var(--muted); white-space: nowrap;
  display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px; position: relative; }
.tab svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--accent); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }
@media (min-width: 720px) { .tab { font-size: 14px; gap: 8px; } }
@media (max-width: 360px) { .tab svg { display: none; } }
.tab .badge { position: static; background: var(--star); color: #fff; border-radius: 999px;
  font-size: 10px; min-width: 16px; padding: 0 4px; line-height: 16px; font-weight: 700; }

.banner { background: var(--live-soft); color: var(--live); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; font-weight: 500; }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live-dot); box-shadow: 0 0 0 4px var(--live-soft); }
.sect.next .dot { background: var(--faint); box-shadow: none; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; background: var(--surface); border-radius: var(--radius); }

.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);

.minor { box-shadow: none; background: transparent; padding: 8px 14px; }

.tba { color: var(--faint); font-style: italic; }

mark { background: var(--live-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

     "id": "013",
     "title": "Behavioural and neural evidence for enhanced beat sensitivity in deaf individuals",
     "abstract": "Beat sensitivity is typically studied in audition, but the temporal prediction mechanisms supporting beat processing may be supramodal and accessible through other sensory channels. We examined vibrotactile beat sensitivity in deaf (n = 17) and hearing (n = 16) adults using frequency-tagging EEG and sensorimotor synchronization during isochronous and temporally complex vibrotactile rhythms. Neural entrainment was quantified as spectral power at beat-related frequencies, and tapping variability indexed behavioral precision. Deaf participants showed significantly stronger neural entrainment than hearing controls and lower tapping variability, with behavioral advantages especially pronounced for temporally complex rhythms. Despite these group differences, neural entrainment was comparable across rhythm types within groups. These findings demonstrate that beat-based temporal prediction can be robustly supported by vibrotactile input in the absence of typical auditory experience. Together, the neural and behavioral results suggest that somatosensory pathways can support predictive timing mechanisms commonly associated with auditory rhythm processing and perception.",

     "id": "020",
     "title": "Assessing Auditory Precision and Long-Term Memory Discrimination in Older Musicians",
     "abstract": "Instrumental music training is associated with enhanced auditory processing, yet its contributions to cognition in aging remain unclear. We investigated whether older musicians (n = 26, 62–85 years) showed enhanced perceptual and mnemonic discrimination compared to older non-musicians (n = 25, 61–82 years). Participants completed a novel auditory paradigm of perceptual and mnemonic discrimination. Mismatch negativity (MMN) was measured in a passive oddball paradigm using pure-tone sequences differing in pitch contour. Participants subsequently discriminated previously presented targets from similar lures and dissimilar foils in perception and memory. Musicians showed enhanced MMN in amplitude and source activity, and greater discriminability for targets relative to lures and foils. No group differences were shown with neural or behavioural measures of visual mnemonic discrimination. Findings suggest that music training is associated with domain-specific benefits to precision in sensory memory and long-term memory that may contribute to cognitive reserve in aging.",

     "id": "040",
     "title": "Age-Related Hearing Loss is Associated with Less Automatic Postural Control",
     "abstract": "Age-related hearing loss is a recognized risk factor for falls and mobility difficulties, but the mechanisms underlying these associations remain poorly understood. Therefore, examining postural control strategies may help clarify how hearing loss contributes to balance impairments. This study examined the effects of age-related hearing loss on standing balance. 22 older adults (OAs) with normal hearing and 22 OAs with hearing loss (OAHL) stood on a force plate in an immersive virtual reality environment while completing no, low, and high listening effort tasks. Postural responses were analyzed using centre of pressure (COP) sample entropy (SE), a measure of movement regularity (lower values indicate more regular fluctuations indicative of less automatic control). OAHL showed lower SE than OAs regardless of listening load conditions, which may reflect increased conscious control of posture. Hearing loss is associated with altered balance behaviour, providing insight into postural control strategies in OAHL.",

     "id": "010",
     "title": "How attended narratives linger in subsequent thought amidst competing speech",
     "abstract": "The content of speech can linger in thought after listening, but whether this occurs amid competing talkers, and whether ignored speech also lingers, remains unclear. Two experiments examined narrative lingering amid competing speech. In Experiment 1, 33 younger adults (18-46 years, Mage=25.21) listened to two simultaneous narratives, attending to one and ignoring the other while EEG was recorded. Narratives were presented at +2 and -6 dB Target-to-Masker-Ratios (TMRs), with a speech-in-quiet baseline. Participants completed free word associations before and after listening. Post-listening words were more semantically similar to the attended story than pre-listening words, indicative of narrative lingering. This effect was unaffected by TMR and absent for ignored stories. EEG analyses examined underlying attentional mechanisms. Experiment 2 (N=10) manipulated speech clarity under more challenging TMRs. Again, lingering occurred for attended but not ignored speech, with no TMR effect. These findings suggest selective attention promotes narrative lingering despite competing speech.",

     "id": "033",
     "title": "Eye-tracking approaches to investigating effort during conversational interactions",
     "abstract": "Conversation consists of a series of rapid back-and-forth exchanges between talkers. The typical durations of these exchanges indicate that, for fluid turn-taking to take place, talkers must simultaneously listen to their partner and plan their next segment of speech. It remains unclear how increased listening difficulty (e.g., due to hearing loss or background noise) affects a talker’s ability to perform this divided attention task. This work will detail our eye-tracking based approaches to investigating this problem. By studying how measures such as pupil size and eye gaze vary systematically during conversation, we aim to understand how increased listening difficulty affects the allocation of cognitive resources throughout a conversation. Results from a series of studies investigating the effects of background noise, hearing loss, second language, and other cognitive demands will be discussed, along with their implications for studying effort during interactive conversations.",

     "id": "019",
     "title": "Social sound change detection in neurotypical and autistic children",
     "abstract": "Autism is characterized by atypical social and sensory processing relative to non-autistic individuals. Here, we explore whether social and sensory processing differences impact neurotypical and autistic 6- to 12-year-olds’ ability to detect when social communicative sounds (e.g., speech) change in busy acoustic scenes. Specifically, we relate IQ, social responsivity, and sensory profiles to children’s sensitivity for detecting communicative sound changes in coherent scenes that reflect real-world environments (e.g., theatre, park). Our preliminary data (23 neurotypical, 23 autistic children) shows that both groups are better at detecting when social communicative sounds change in busy scenes relative to animal, mechanical, or natural world sounds, but this bias toward communicative sounds is more pronounced in neurotypical children. Thus far, only IQ is associated with communicative sound change detection sensitivity. Overall, this work provides relevant insights for clinicians and families of neurodiverse children related to their attention to communicative sounds in busy everyday settings.",

     "id": "035",
     "title": "Pilot Study for a Gamified Real-time Neurofeedback Ear Training Task for Cochlear Implant Users",
     "abstract": "Cochlear implants (CIs) are the oldest and most widely used neuroprosthetic, yet up to 80% of variance in real-world hearing outcomes remains unexplained. There is therefore significant clinical interest in post-operative therapeutic interventions. We introduce a novel ear-training paradigm for CI users based on dichotomous listening that targets naturalistic demands on auditory attention. Furthermore, our task is the first to incorporate gamified, real-time neurofeedback based on neural tracking with a multivariate temporal response function (mTRF). A pilot study of six participants suggests that our novel task is better suited for ear-training using realistic audiovisual stimuli than the traditional version of the task. We obtain higher mean neural tracking of the target stimulus (mean Pearson correlation coefficient of 0.13 vs. 0.09, p<0.01) and better suppression of the ignored stimulus. More ecologically valid ear training paradigms such as this one may improve real-world CI hearing outcomes.",

     "id": "012",
     "title": "Longitudinal Adaptations in Neural and Behavioral Systems Following Hearing Restoration Using Cochlear Implants",
     "abstract": "How the brain adapts to cochlear implant (CI) input during real-world speech remains poorly understood, as most longitudinal studies rely on simplified auditory stimuli. We tracked 19 newly implanted adults at activation and 3, 6, and 12 months later using EEG during naturalistic continuous speech with competing talkers, alongside speech recognition, spatial listening, and quality-of-life measures. Temporal response functions quantified cortical tracking of attended and unattended speech. Speech recognition improved over time, and spatial-separation benefits emerged by six months. Attended speech elicited stronger and earlier neural tracking than unattended speech, accompanied by longitudinal changes in scalp response patterns. Stronger attended-speech tracking was associated with better speech recognition, spatial hearing, and quality of life. Most behavioral and neural changes occurred within the first six months, demonstrating rapid early reorganization of cortical speech processing under ecologically relevant listening conditions.",

     "id": "017",
     "title": "Exploring the Functions of Music from Experience to Experiment",
     "abstract": "Music serves many functions in everyday life, from regulating emotion to connecting with others. Across two studies, we examined musical functions through qualitative and experimental approaches. Through semi-structured interviews with musicians and non-musicians, we examined when, why, and how adults use music in their lives. Thematic analyses highlighted emotion regulation, social connection, routine, learning, and identity as key functions, but musicianship impacts how often these functions, especially social connection, are mentioned. Next, we contributed to a multi-lab collaboration, ManyVoices, where we tested whether group singing, synchronous recitation, or conversation impacted social bonding in undergraduates. Across sites, singing resulted in the greatest increase in social bonding, but our site did not find this effect. We will discuss the impact of musicianship on social bonding and use our qualitative results to inform future experimental directions to help us better understand the many functions music plays in people’s lives.",

     "id": "005",
     "title": "How Children Engage with Auditory Narratives: Measuring Subjective and Neural Absorption",
     "abstract": "This study investigated how children engage with auditory narratives that vary in cognitive demand rather than intelligibility. Children aged 9–12 (N= 40) listened to child-directed stories while EEG data were recorded, and self-report measures of engagement were obtained. Contrary to predictions, the child-directed stories did not differ from the control in alpha or theta power. However, the Comedy story elicited greater neural synchrony across listeners, indexed by inter-subject correlation, than the Control or Fantasy stories. Self-report ratings showed higher engagement, particularly through enjoyment, for both child-directed stories than for the control. Together, these results indicate that children's engagement with naturalistic narratives is reflected more in the temporal consistency of the neural response than in average oscillatory power and underscore the role of story content in shaping engagement. Understanding these mechanisms can inform strategies to support attention and comprehension in real-world listening environments.",

     "id": "014",
     "title": "When Sound Meets Memory: Perceptual Comparison Biases Auditory Working Memory",
     "abstract": "How does a new sound change what we remember hearing? In vision, new input systematically biases memory, especially when it is perceived to be similar to the memory. To test whether a domain-general principle underlies this effect, we adapted a continuous-report auditory reproduction task using a circular Shepard-tone space to measure direction and magnitude of memory shifts. Participants (N=36) remembered a target tone and reproduced it after a delay. Critically, a probe tone was played during the delay, and it was either ignored or explicitly compared with the target. Overall, reproductions were systematically attracted toward the probe. During comparison, bias tracked perceived similarity beyond physical proximity: after accounting for target-probe distance, probes judged similar produced greater attraction than those judged dissimilar. Together, these findings suggest a broader principle of memory–perception interaction: auditory memory is dynamically shaped by new sensory input, with its influence reflecting how that input is perceived.",

     "id": "025",
     "title": "Mapping Central Gain from Brainstem to Auditory Cortex Using Simultaneous ABR and MLR in Aging and Hearing loss",
     "abstract": "The central auditory system may compensate for degraded peripheral input by increasing neural activity at later processing stages, termed central gain enhancement. We combined auditory brainstem responses (ABRs) and middle-latency responses (MLRs) to characterize brainstem-to-cortical profiles associated with age and high-frequency hearing thresholds (HFPTA). Adults aged 18–82 years completed simultaneous recordings of ABR waves 1 and 5 and MLR components Na, Pa, Nb, and Pb across five click intensities. Logarithmic MLR-to-ABR ratios characterized later auditory activity relative to brainstem output. Older adults and participants with poorer HFPTA exhibited smaller wave 5 amplitudes but greater Pb amplitudes, consistent with reduced brainstem output alongside enhanced later cortical activity. Linear mixed-effects models demonstrated that brainstem-to-cortical trajectories varied systematically with both age and HFPTA, with component dependent rather than uniform changes across the pathway. These findings demonstrate that multicomponent pathway trajectories can characterize distinguishable age and hearing related patterns of auditory neural activity.",

     "title": "Barriers and facilitators for helmet use in deaf and hard of hearing athletes",
     "abstract": "Hearing loss is associated with reduced participation in physical activity across an individual’s lifespan (Assi et al., 2024; Goodwin et al., 2024), often due to cognitive fatigue, stigma, social isolation, and communication challenges experienced in active spaces (Mester et al., 2025; Nedrud et al., 2025; Rich et al., 2024). Athletes who use hearing devices encounter many unique barriers related to comfort, situational awareness, and hearing accessibility during sport. The goal of this project is to investigate current gaps in the literature in partnership with patients to identify what challenges need to be prioritized to improve sports experiences. This is achieved through a structured environmental scan (Charlton et al., 2021) of peer-reviewed and grey literature to build a clearer understanding of the experiences of athletes who use hearing aids, cochlear implants, and bone conduction devices.",

     "id": "009",
     "title": "Ex-squeeze-me? Listeners readily incur the costs of physical action to reduce the need for cognitive effort and maximize hearing success",
     "abstract": "Models of auditory functioning suggest that physical behaviours (e.g., moving closer to speaker) and effortful allocation of cognitive resources (e.g., listening effort), while each constituting specific costs, are both adaptive responses to adverse auditory conditions that may be readily substituted for each other to maximize hearing success. Here we demonstrate that listeners readily exchange the costs of physical actions (hand-dynamometer squeezing) for easier listening conditions (reduced babble noise) in upcoming Revised Speech Perception in Noise (R-SPIN) sentences. Participants exerted greater squeeze-force when listening conditions were more difficult, particularly with higher noise and unpredictable sentences. Squeeze force also increased following incorrect responses and trials rated as highly effortful, revealing an influence of recent listening experience on subsequent effortful exertion. These findings demonstrate that physical exertion varies systematically with both current and preceding listening demands. Handgrip force may therefore offer a novel index of adaptive effort allocation during speech-in-noise perception.",

   "id": "021",
   "title": "Future-Prediction Error Explains Auditory Cortical Responses Beyond Acoustic Features",
   "abstract": "Evidence from sensory systems suggests that predicting the immediate future of sensory input may be a computational principle of sensory processing. Here, we test this hypothesis in continuous speech using a future-prediction approach previously shown to produce receptive fields resembling those observed in auditory cortex. The model predicts future speech acoustics from the recent acoustic past, and we ask whether a signal generated by this predictive computation can account for auditory-cortical responses measured with MEG. Acoustic prediction error (PE) derived from the model's predictions was used in source-space temporal response functions to test whether PE explains held-out neural variance beyond envelope, derivative, onset, and offset predictors. Adding PE to the acoustic controls increased held-out explained variance across all listeners. The contribution of PE beyond these acoustic controls supports future prediction as a candidate computation underlying auditory-cortical processing of continuous speech.",

   "id": "006",
   "title": "Speech Motor Control in Attention-Deficit Hyperactivity Disorder (ADHD)",
   "abstract": "Attention and sensory processing patterns have been linked to a differential weighting of feedback and feedforward speech motor control systems. However, it remains unclear whether clinical attentional and sensory differences alter speech motor control. The behavioural and neural correlates of speech motor control were examined in individuals with and without ADHD. Seventy-three adults ages 17-38 years with (n=38) and without ADHD (n=35) completed a frequency-altered feedback (FAF) task where their auditory feedback was shifted ±100 cents, and compensatory vocal responses were measured to index feedback control. Concurrently, event-related potentials were measured to examine neural responses to FAF. The Sustained Attention to Response Task (SART) and the Adult/Adolescent Sensory Profile (AASP) measured attention and sensory processing patterns, respectively. Although ADHD participants displayed attentional and sensory differences, vocal and neural responses to FAF did not differ between groups. Regardless of diagnosis, AASP scores were related to decreased weighting of feedback control.",

   "id": "004",
   "title": "Developing an Electrophysiological Protocol to Measure Listening Effort",
   "abstract": "Listening effort (LE), or the cognitive exertion required to understand speech in noise, is a multifaceted process that remains difficult to quantify objectively. Elevated LE can contribute to cognitive strain, social withdrawal, and reduced quality of life, highlighting the need for a reliable objective measure.\nElectroencephalography has emerged as a promising non-invasive tool for identifying neural correlates of LE, with alpha-band activity implicated in the neural processing of effortful listening. \nIn this study, EEG was used to examine parietal-central alpha event-related desynchronization (α-ERD) during a speech-in-noise task at signal-to-noise ratios (SNR) of 5 and 0 dB. At 0 dB SNR, reduced parietal-central α-ERD was associated with higher speech-in-noise accuracy and was more prominent among participants with lower (better) low-frequency hearing thresholds, suggesting sensitivity to individual auditory capacity.\nThese findings support α-ERD as a functionally relevant neural marker of effortful listening, contributing to developing a standardized electrophysiological measure of LE.",

  {
   "id": "037",
   "title": "Accent type modulates frequency-specific neural tracking of speech",
   "abstract": "Listeners often find speech in a non-native (L2) accent harder to understand than speech in their own native (L1) accent. Although most research on L2 accent processing uses speech-in-noise paradigms to avoid ceiling effects, this preregistered EEG study explored L2-processing difficulties in ideal listening conditions and using neural tracking to provides a sensitive measure of such processing. Canadian English-speaking adults were presented with Canadian (L1) and Mandarin-accented (L2) English. We found significantly stronger neural tracking for L1-accented speech, in delta-theta frequencies, as well as higher-frequency bands associated with fine-grained phonemic encoding. Neural tracking was greater for L1- than L2-accented speech at the word and phoneme rate, and neural tracking correlated with transcription errors. These findings indicate that accent type modulates neural tracking of speech at specific frequencies, even in passive, quiet settings, offering a foundation for future work on accent processing across more diverse speaker and listener populations.",

   "id": "041",
   "title": "Optimizing the multivariate temporal response function(mTRF) framework for better identification of neural responses to partially dependent speech variables",
   "abstract": "Forward modeling using the multivariate temporal-response function (mTRF) has become an increasingly popular method for investigating the neural bases of speech processing. The mTRF model is highly versatile thanks to its ability to include different speech stimulus representations as input, allowing it to probe specific neural processes. Here, we examine the ability to separate the neural effects of low-level speech characteristics, specifically the acoustic spectrogram and binary feature vectors that represent phonetic properties. Notably, isolating the unique contribution of these two features to a neural signal is challenging because they share substantial mutual information. \nTo address this, we propose enhancing the mTRF framework by introducing a novel cyclic-permutation-based statistical method to reduce false positives owing to temporal autocorrelation inherent to speech, and we demonstrate the effectiveness of these innovations on EEG data from natural language listening in adults with normal hearing (n=27).",

   "id": "031",
   "title": "Physiological markers of sustained and phasic SNR level changes during story listening",
   "abstract": "Listening effort in noisy environments may reflect early hearing decline, so objective measurement matters. Most studies use short sentences in steady noise, yet real-world noise fluctuates transiently (e.g., passing car). Our experiment examines sustained listening effort (steady noise) with phasic effort changes (signal-to-noise ration [SNR] decreases) using pupil dilation, eye movements, and head movements. Participants listened to 2.5-minute stories at easy, moderate, or difficult noise levels. Each story contained five 5-second intervals of phasic decreases in SNR. Preliminary results showed that self-rated understanding of the stories and comprehension accuracy fell as noise increased. Head movements decreased during phasic intervals and at harder sustained noise levels, while pupil size and gaze dispersion showed no effects. This tentatively suggests transient noise fluctuations increase listening effort, reflected in head movements. A follow-up sample is being collected to test reproducibility of eye measures.",

   "id": "028",
   "title": "Ocular and head responses to listening effort and memory load in older listeners",
   "abstract": "Listening effort, an early sign of hearing difficulty, increases pupil size and, in young adults, reduces gaze dispersion and head movement. Whether these markers may also index the effort of holding speech in memory, beyond perceiving it, remains unknown, particularly in older adults. Fourteen older adults performed a modified Sternberg task while wearing a mobile eye-tracker, hearing two or six spoken digits (memory load) and at an easy and a difficult SNR in twelve-talker babble (acoustic load), then judging whether a probe digit had occurred. Lower SNR reduced accuracy; higher memory load slowed responses without reducing accuracy. During encoding, lower SNR reducedgaze dispersion and head movement. Higher memory load also reduced gaze dispersion, but affected neither pupil size nor head movement. These results suggest that listening effort is multicomponent rather than unitary. Combining gaze, pupil, and head indices could separate perceptual and memory demands older listeners face, helping identify whether difficulties arise from hearing or retaining speech.",

   "id": "016",
   "title": "Verbatim to Gist: Auditory and Cognitive Factors in a Modified Speech-in-Noise Task",
   "abstract": "Older adults report greater difficulty understanding speech-in-noise, reflecting age-related changes in audition and cognition. However, speech-in-noise tasks use short phrases that primarily assess auditory processing. Here, we examine auditory and cognitive factors in a modified speech-in-noise task. Older adults (N = 29) and younger adults (N = 23) listened to sentences of nine lengths (4–24 words) presented in clear or at two individually calibrated noise levels (80% - easy; 60% - hard intelligibility). Participants also completed audiometry and the Toronto Cognitive Assessment. We characterized accuracy across sentence lengths. The decline in accuracy across sentence length was greater in older adults than younger adults in the easy condition. Younger adults also maintained high accuracy longer before performance declined, and showed greater evidence of gist-based strategies in the longest sentences. Together, these findings suggest that although accuracy declines with increasing sentence length, younger adults maintain performance over longer sentences, potentially through gist.",

   "id": "027",
   "title": "The Role of General Cognitive Ability in Individual Differences in Speech-in-Noise Performance",
   "abstract": "Objective\nTo examine whether general cognitive ability explains individual differences in speech-in-noise (SiN) performance.\nBackground\nListeners with similar hearing loss differ in speech understanding and hearing-aid benefit. Research has focused on specific domains (e.g., working memory), overlooking cognition's broader structure. Cognitive task scores correlate positively (positive manifold), so sampling core domains (fluid intelligence, processing speed, working memory) yields a proxy for general cognitive ability.\nMethods\n222 normal-hearing, American English-speaking adults (M age = 53.40, SD = 6.74) completed an online cognitive battery and a spectro-temporal modulation (STM) sensitivity test. Also, SiN recognition was measured.\nResults\nThe full model accounted for 26.8% of the variance in SiN perception (p < .001). Adding cognitive predictors accounted for significant variance even after accounting for STM sensitivity and demographics.\nConclusions\nSiN perception in normal-hearing older adults is supported by cognitive abilities. Accounting for cognitive ability could sharpen audiometric assessment and improve hearing-aid outcomes expectations.",

   "id": "029",
   "title": "Preserved Neural Event Representations Despite Reduced Semantic Prediction During Effortful Listening",
   "abstract": "Understanding everyday speech in challenging listening environments requires listeners to continuously predict upcoming information while organizing input into meaningful events for effective encoding. It remains unclear whether these predictive processes operate similarly across linguistic and event timescales. In this experiment, participants (N=32, 20–35 years) listened to four stories from Born a Crime during fMRI, overlaid with twelve-talker babble across four conditions (clear, +9, +4, and –1 dB SNR). Analyses modeled word-level semantic surprisal and LLM-identified event boundaries across cortical regions. Surprisal increased bilateral superior temporal activity, but this effect weakened in left temporoparietal cortex with decreasing intelligibility. Event boundaries elicited increased activity in frontoparietal, attention, and posterior medial regions and deactivations in lateral temporal regions of the default mode network. Critically, boundary responses did not vary with background noise. Even as intelligibility declines and word-level predictive processing weakens, event-level neural responses remain stable, suggesting that higher-order event structure supports real-world comprehension.",

   "id": "018",
   "title": "Understanding speech intelligibility and gist recall performance when listening to context-rich stories against informational masking",
   "abstract": "Background: Context can facilitate speech intelligibility performance, yet there is limited evidence on whether this applies to gist recall or when exposed to informational masking.\n\nMethods: Young adults (N = 32) listened to ~45-second stories in quiet or amidst two competing speakers at a SNR of 0 and -6 dB. Half of the stories had reduced context by shuffling the sentences within the story, excluding the final sentence. After each story, participants repeated the final sentence (verbatim intelligibility) and provided a detailed recall of the story (gist).\n\nResults: Across SNR levels, context facilitated gist recall (p < .001) but not speech intelligibility (p = .559). The temporal order of gist recall for shuffled stories did not align with either the original story sequence or the shuffled order.\n\nConclusion: Narrative context facilitated gist recall but not speech intelligibility, which implies potentially different mechanisms between global, narrative context and local, within-sentence context facilitation.",

   "id": "047",
   "title": "The Role of General Intelligence in Speech-in-Noise Intelligibility",
   "abstract": "Listeners' scores on cognitive tests often predict the intelligibility of speech in noise (SIN) above and beyond audiometric thresholds. In particular, based largely on studies using the Reading Span, working memory has been proposed to play a key role in SIN intelligibility. However, cognitive abilities are positively intercorrelated, which can be statistically described by a “general intelligence” factor. Thus, an association between working memory and SIN intelligibility may be artefactual: another cognitive ability correlated with working memory, or even general intelligence itself, may instead underlie performance in SIN tests. To assess this, a two-session study was conducted online. Four hundred and twenty-two adults aged 18–45, screened for normal hearing via questionnaire, completed both sessions and were retained after data-quality screening. In the first session, participants completed three tests each of coherent SIN intelligibility, incoherent SIN intelligibility, and crystallized knowledge. The two SIN abilities were correlated nearly perfectly, so they were combined into a single ability for further analyses. In the second session, participants completed three tests each of working memory (including the Reading Span), fluid reasoning, processing speed, and attention control. Bivariate correlations revealed that while working memory tests did predict SIN intelligibility (rs = .17–.21), other abilities did so even better, such as fluid reasoning (rs = .35–.43) and attention control (rs = .30–.36). Structural equation modelling revealed that general intelligence accounted for 29% of the variance in SIN intelligibility, with other abilities contributing less than three additional percentage points. The only ability that ever explained significant additional variance was fluid reasoning, but this depended on the model specification, and it is difficult to interpret given fluid reasoning's strong statistical and conceptual relationship with general intelligence. Working memory explained no variance beyond general intelligence. Attention control was nearly indistinguishable from general intelligence (loading = .99), and its tasks were especially brief and enjoyable to participants. Based on these findings, general intelligence appears to be the better predictor of SIN intelligibility and the more parsimonious explanation for the role of cognition in SIN. Cognitive testing in audiology should thus emphasize tests that index general cognition, such as the attention control tasks used here.",

   "id": "015",
   "title": "Sex differences in the predictors of subjective hearing difficulties and listening effort",
   "abstract": "While objective hearing loss is often worse in males than females, potential connections between biological sex and the subjective aspects of hearing difficulties (i.e., hearing-handicap, listening effort) have been largely overlooked. Subjective hearing difficulties – and their cognitive-affective correlates (e.g., attentional difficulties, boredom) – are important because they impact hearing-rehabilitation decision-making. We therefore examined associations between sex and subjective hearing difficulties in exploratory analyses involving a large sample (N = 1,814) of older and younger adults. We replicate findings that males have worse objective hearing loss than females, and find that males also report significantly greater hearing-handicap and listening effort. In regression analyses predicting listening effort and hearing-handicap (and controlling for age), we find that sex significantly interacts with boredom proneness, such that sex differences only emerge in those high in boredom proneness (not low). This suggests that sex plays important role in the cognitive-affective predictors of subjective hearing difficulties.",

   "id": "022",
   "title": "Effects of Noise and Task Type on Semantic-Lexical Content",
   "abstract": "Prior work has shown that turn-taking timing shifts under challenging acoustic conditions, serving as a key indicator of listening effort; however, lexicosyntactic cues offer crucial additional insight into these cognitive demands. Beyond timing, the linguistic content of speech is also expected to change as listening becomes difficult. This study examines how content-level measures, specifically lexical diversity and semantic similarity, vary across different listening and task conditions. We apply Natural Language Processing techniques to a dataset of native English speakers conversing in quiet and noise under both free and task-based conditions. Background noise reduced semantic dispersion, suggesting that listeners focused more narrowly and engaged in fewer off-topic shifts. Analyzing these content measures at the turn level captures dynamic linguistic patterns across conversation. Ultimately, this approach reveals whether adaptations to adverse conditions emerge at the local (turn) or global (conversation) scale, and whether speakers dynamically adjust their linguistic strategies in response to immediate conversational demands.",

   "id": "046",
   "title": "Processing Unattended Speech: Differences between Clear and Degraded Speech",
   "abstract": "Speech is often present in the environment when we are focusing on an unrelated task; a tv or radio may be playing, or someone sitting at a neighboring table may be having a conversation. The sound from this speech is processed automatically to some degree, and we may or may not be able to report what was said if asked about it. When speech is degraded by background noise, transmission distortion, or hearing loss, it is often perfectly intelligible when cognitive resources, such as attention, are applied. However, when cognitive resources are diverted elsewhere for another task, how much degraded speech is processed into an intelligible message? The hypothesis is that measures of low-level acoustic processing will not be different for clear and degraded unattended speech, but measures of higher-level semantic processing will show better performance for clear speech than for degraded speech. The preliminary results support theories of limited domain-general cognitive resources and provide some insight into processing differences between clear and degraded speech when the listener is engaged in an unrelated task.",

   "id": "036",
   "title": "Harmonic Expectation is Shaped by Exposure Specificity: Comparing Chord Discrimination in Western-only vs Western+ Listeners",
   "abstract": "Harmonic expectations shape how listeners perceive and evaluate unfolding chord sequences. These expectations are culture-specific, yet most research in this field relies on Western-only listeners. Here, 80 participants with either narrow (primarily Western) or broad (Western and other) musical enculturation selected which chord differed between two similar Western four-chord sequences while electroencephalography was recorded. Target chords were expected or unexpected relative to the local harmonic context.\nBehavioural results suggest both groups were better at detecting unexpected (more jarring) targets than expected targets. The gap in performance on target types was exaggerated for Western-only listeners – those with musically multicultural backgrounds better identified expected targets. This suggests narrowly encultured listeners have greater difficulty detecting differences that still “fit,” while more broadly tuned listeners are less reliant on expectation violations to guide performance. Preliminary EEG analysis supports earlier work indicating larger ERP amplitudes for unexpected chords, though group comparison analyses are still ongoing.",

  {
   "id": "043",
   "title": "The Perceived Musicality and Listening Experience of AI-Generated Music",
   "abstract": "Generative Artificial Intelligence (AI) music is a rapidly evolving technology, with millions of AI-generated songs uploaded and circulated across music streaming platforms. As AI-generated music tools continue to advance, it is imperative to study their impact on listening perception in the present age before future technological developments outpace the ability to investigate them. In our ongoing study, we examine whether AI-generated music can be distinguished from matched human-composed songs across five musical genres in two formats: standard (i.e., songs with vocals and instrumentation) and instrumental. Preliminary data show that AI-generated music cannot be reliably distinguished from human-composed songs, with detection accuracy remaining near chance levels irrespective of musical genre or format. Individual differences in musical sophistication and genre preference did not significantly moderate detection accuracy, demonstrating that neither listener traits nor acoustic features facilitate discrimination. Further examination of perceptual cues revealed that listener judgments were primarily driven by vocal characteristics (e.g., unnatural timbre), instrumental and audio quality (e.g., instrumentation errors, spectral noise), and musical structure (e.g., repetitiveness), regardless of classification accuracy. Furthermore, self-reported enjoyment did not differ significantly between AI-generated and human-composed music. Taken together, our findings suggest that listeners blind to the compositional origin fail to distinguish AI-generated music from human-composed music and evaluate both with comparable aesthetic evaluations. Given that musical sophistication does not confer a discrimination advantage, identifying effective strategies to support listener detection will be necessary to mitigate deception in digital listening environments.",

   "id": "045",
   "title": "How Does Pitch Discriminability Influence Tapping Accuracy?",
   "abstract": "Cochlear implants allow individuals with severe to profound hearing loss to access sound. However, pitch discrimination is challenging, with discrimination thresholds often well over one semitone. For normal hearing individuals, changes in pitch influence beat perception as well as production. Previous findings by Ammirante and colleagues revealed that when tapping along to a melody, participants’ taps got faster when the melodic direction remained consistent, and their taps got slower when the melodic direction changed. This study investigates how limiting pitch discriminability influences the performance of normal hearing participants in a similar synchronization-continuation tapping task. Participants will tap along to melodies consisting of normal tones or vocoded tones, designed to elicit performance similar to what may be expected from cochlear implant users. Pilot results suggest that normal tones will replicate previous findings, but it is expected that the effect of pitch on tap timing will be reduced for vocoded tones.",

   "id": "042",
   "title": "Getting in Tune: Vocal Harmonic Coordination, Inter-Brain Synchronization, and Social Bonding During Joint Humming",
   "abstract": "Shared humming offers a way to examine how vocal coordination relates to inter-brain synchronization (IBS) and subjective interpersonal closeness. We studied unfamiliar, sex-matched dyads completing solo and paired humming conditions. Functional near-infrared spectroscopy measured IBS, focusing on left inferior frontal cortex. Audio recordings were analysed in Praat to estimate vocal coordination, while self-reports assessed perceived synchrony and interpersonal closeness.\nAt this stage in data collection (50% of sample required to achieve desired power), IBS was greater between real dyads than randomly paired participants, suggesting dyad-specific neural coordination. While paired humming led to a numeric increase in IBS relative to solo humming under some conditions, this advantage has not reached significance. Ongoing analyses examine whether vocal harmonic coordination relates to perceived synchrony, closeness, and IBS. Together, these findings highlight the value of examining behavioural, neural, and subjective dimensions of interpersonal coordination when investigating how shared musical experiences relate to social connection.",

   "id": "044",
   "title": "Why Older Adults Turn to Music When Lonely: The Roles of Nostalgia, Comfort, and Distraction",
   "abstract": "Loneliness is a pressing health concern among older adults with well-documented consequences for physical and mental health. Although music has been identified as a promising and accessible tool for reducing loneliness, little research has examined which functional uses of music are most effective in achieving this outcome in older adults. Across two studies, my MA thesis employed a mixed methods approach to address this gap. Study 1 used qualitative interviews and reflexive thematic analysis to identify nostalgia, comfort, and distraction as primary functional uses of music for lonely older adults. Study 2 experimentally tested the effectiveness of these functions using a 4 (listening condition) x 2 (time) mixed ANOVA design. Although no statistically significant effects were observed in the preliminary analyses, loneliness showed a tendency to decrease following exposure to comforting music. Together, these findings provide a theoretical framework for understanding how older adults use music during periods of loneliness.",

   "id": "008",
   "title": "Repeated Music Listening Modulates Beta Band Oscillatory Activity and Autobiographical Memory in Older Adults",
   "abstract": "Evidence suggests that listening to autobiographically salient (ABS) music (i.e., associated with significant people, places, events) generates distinct neural oscillatory activity compared with familiar (FAM) music (i.e., recognized but lacking personal significance). We assessed the effects of a two-week ABS music-listening intervention on autobiographical memory and music-evoked oscillatory activity in 33 healthy older adults. Listening experiences documented throughout the intervention were examined. Following the intervention, reliving and narrative coherence subscores on the Autobiographical Recollection Test increased. Time-frequency analysis revealed a reduction in left parietal beta desynchronization in response to ABS compared to FAM. A repeated-measures correlation revealed positive associations between ABS parietal beta power and reliving. Four themes characterizing the listening experience were identified: emotional responses; autobiographical reflection; active engagement; evolving responses over time. These results suggest that a two-week ABS music-listening intervention is associated with increases in autobiographical memory, modulations in music-evoked oscillations, and multifaceted listening experiences in older adults.",

   "id": "011",
   "title": "Are Neural Signatures of Familiarity Domain-General? Evidence from an Exploratory Meta-Analysis of Familiar Face Processing",
   "abstract": "Neural responses to familiar stimuli have been extensively studied, yet whether such effects converge across the auditory and visual domains remains unclear. We conducted an activation likelihood estimation (ALE) meta-analysis of 25 neuroimaging contrasts comparing familiar versus unfamiliar faces in healthy adults. Convergent activation was observed in medial prefrontal regions, including the anterior cingulate cortex and the left middle and superior frontal gyri, consistent with person knowledge, evaluative, and self-referential processing. These clusters did not overlap with prior findings for familiar music (Vuong et al., 2023), which predominantly involve sensorimotor and insular regions, suggesting that familiarity engages domain-specific neural networks. While auditory familiarity may rely on predictive coding and temporal-motor circuits, visual face familiarity appears to preferentially recruit higher-order prefrontal systems supporting identity retrieval. These results offer a foundation for future studies investigating cross-modal representation of familiarity.",

   "id": "023",
   "title": "Assessing mHealth Readiness Among Hearing Healthcare Providers",
   "abstract": "Purpose: This study aimed to assess hearing healthcare professionals’ readiness to implement mHealth and to identify barriers and facilitators to clinical implementation. \n\nMethod: A five-part, 33-item questionnaire collected demographic information and assessed core, engagement, and structural readiness; reported mHealth use; and implementation considerations. \n\nResults:/Conclusions: Core and engagement readiness exceeded structural readiness, and reported mHealth use centered on the provision of support services (e.g., hearing aid-connected apps). Professionals identified digital literacy and technical capabilities as additional relevant implementation considerations. Although they recognized a need for mHealth and expressed willingness to engage with it, they reported gaps in organizational guidelines, support, and education. These findings suggest that strengthening organizational infrastructure and implementation support may help translate readiness into routine clinical practice.",

   "id": "034",
   "title": "Influence of Visual Motion on Postural Control in Older Adults With and Without Hearing Loss",
   "abstract": "Older adults with age-related hearing loss (ARHL) are up to three times more likely to experience a fall than peers with normal hearing, yet the mechanisms underlying this association remain unclear. Because the auditory and vestibular systems are closely connected, age-related auditory decline may co-occur with vestibular changes that compromise balance. Individuals with ARHL may compensate by relying more heavily on visual information. This study examined postural control in older adults (65+) with and without ARHL using a visual perturbation paradigm. Participants completed a standing balance task in an immersive virtual reality environment while postural sway was recorded during forward optic flow perturbations varying in speed (1.5-4.5 m/s) and temporal predictability. Older adults with ARHL exhibited reduced postural sway compared to those with normal hearing. These findings suggest that ARHL is associated with more rigid postural control, highlighting potential sensory mechanisms linking hearing loss and falls risk.",

   "id": "002",
   "title": "Developing a Tool to Measure Emotion Perception Abilities of Cochlear Implant Users",
   "abstract": "Cochlear implants (CIs) have restored access to sound for more than one million people with severe-to-profound hearing loss. Despite improvements in speech perception, many CI users still struggle to recognize emotions in speech and music, limiting social participation and well-being. \nProgress in emotion-focused CI rehabilitation has been hindered by the lack of specialized assessment tools.\nThis study aims to develop and validate a freely available auditory emotion assessment for CI users. We evaluated 16 brief musical and vocal affect bursts from the Montreal Affective Voices (MAV) and Montreal Emotional Bursts (MEB) databases in 40 adults with typical hearing under unprocessed and CI-simulated listening conditions. Construct validity was examined using multimodal emotion-recognition tasks and measures of auditory functioning. \nItem analyses identified baseline performance patterns that will guide final item selection. This tool will support emotion assessment in CI rehabilitation and inform targeted interventions.",

   "id": "038",
   "title": "Effect of negative aging stereotypes on hearing ability and attitudes toward hearing aids",
   "abstract": "Previous research suggests that negative attitudes toward aging negatively affect self-perceptions of hearing (Barber & Lee, 2015). The objective of this study was to replicate this effect and to measure additional influences on speech perception and attitudes toward hearing health. 113 adults aged 60 and above, with normal cognitive functioning and pure tone average thresholds < 40 dB HL, were randomly assigned to read a description highlighting negative health outcomes associated with aging and hearing loss (treatment group) or a description describing the impact of earbud use on hearing function (control group). Participants also completed measures of speech perception, subjective hearing problems, and attitudes to hearing aids. Preliminary results suggest that the negative stereotype description group reported better, not worse, subjective hearing ability, compared to the control group. Exposure to negative aging stereotypes may have highly context-dependent effects on self-rated hearing ability (e.g., in-lab vs. online; addition of hearing tests).",

   "id": "026",
   "title": "A Scoping Review to Inform Audiological Monitoring in Adults Living with Diabetes",
   "abstract": "Background: Diabetes is a significant risk factor for hearing loss. One in four adults living with diabetes has moderate-to-severe hearing loss. Although diabetes is widely recognized for its effects on the eyes, kidneys, nerves, and heart, its impact on hearing health remains overlooked.\nObjective: To synthesize evidence on hearing loss screening, assessment, and monitoring in adults living with diabetes and identify knowledge gaps to inform current practice and future integrated care. \nDesign: A scoping review was conducted using the Joanna Briggs Institute methodology.\nResults: In total, 201 studies were included. Pure-tone audiometry was the most frequently used assessment method. Fewer than half of the studies recommended hearing screening, assessment, or monitoring of hearing health for adults living with diabetes; six recommended early referral for hearing care. \nConclusion: The findings highlight gaps in hearing health monitoring guidance and inform a framework for integrating hearing health into person-centred diabetes care.",

   "id": "007",
   "title": "Audiovisual Speech Accessibility Study (ASAS)",
   "abstract": "Older adults with hearing loss (HL) show improved speech perception in noise when they can both see and hear a talker compared to those without HL, but the reason for this are unclear. One explanation is that provision of visual information improves confidence in responses. To test this claim, older adults with and without HL were presented with audio-only and audio-video clips of a talker speaking a monosyllabic word. Participants reported the word they perceived and rated response confidence. Stimuli were presented in background babble noise set to participants’ 50% word recognition during audio-only listening. Eyetracking was recorded during audio-visual listening. Accuracy and confidence improved for audio-visual compared to audio-only condition, but this did not depend on HL level. HL did not correlate to eyetracking. However, secondary analysis found that women had greater accuracy during audiovisual perception compared to men, indicating potentially important sex or gender differences.",

  {
   "id": "030",
   "title": "Neural Mechanisms Supporting Reflective Attention in Older Adults",
   "abstract": "Cochlear implants (CIs) are neuroprosthetic devices that can restore hearing input to individuals with severe-to-profound hearing loss. Hearing loss is linked to declines in cognitive functions such as attention and working memory, which has led to the idea that cochlear implantation may support cognitive improvements. Reflective attention, or directing attention to information held in working memory, may be particularly important when listening in challenging environments. Ojha et al. (2024) found similar behavioural performance between CI users and age-matched listeners with normal hearing using an audiovisual delayed match-to-sample paradigm. However, limited set sizes and reliance on behavioural measures may have obscured group differences. The present study evaluates a modified paradigm with larger set sizes and EEG to examine behavioural and neural measures of reflective attention. The paradigm is currently being evaluated in young and older adults with normal hearing to characterize reflective attention across age and hearing status.",

  {
   "id": "003",
   "title": "Conversation Dynamics Among Older Adults with Age-Related Hearing Loss",
   "abstract": "Age-related hearing loss (ARHL) is associated with negative social outcomes, yet standard speech-in-noise tests rely on isolated, non-interactive tasks that fail to capture real conversations. This study examined how background noise and hearing loss severity jointly shape task performance, workload, conversation satisfaction, and social connection during a naturalistic, goal-directed communication task. Thirty-nine older adults with ARHL completed a map task with a research assistant across two noise conditions (no noise vs. 70 dBA multi-talker babble). Hearing loss severity was operationalized as mean high-frequency pure-tone average (HFPTA). Results showed that performance and social connection were unaffected by noise or hearing loss severity. However, noise increased physical demand, temporal demand, effort, and overall workload, and reduced conversation satisfaction, and hearing loss severity showed no significant effects on any outcome. These findings suggest older adults with ARHL can sustain successful conversation under noise, but only at a measurable subjective cost to their effort and satisfaction that conventional assessments would fail to detect.",

   "id": "024",
   "title": "Decoding Auditory Spatial Attention from EEG for Adaptive Hearing Devices",
   "abstract": "Current hearing aids rely solely on acoustic information and do not have direct access to their wearer’s attentional intent, thus rely on simple and potentially inaccurate heuristics to determine which sound source to prioritize. This project investigates the application of Auditory Spatial Attention Detection, using electroencephalography to decode spatial direction of auditory attention to enable dynamic beamformer steering for hearing aids applications. For this study, participants will complete three (90° separation) and five speaker (45° separation) paradigms incorporating localizing speech under varying noise conditions across four sessions. The objective is to characterize neural markers of auditory spatial attention and determine if these generalize across noise condition, participants, sessions, and degree of angular separation. Additional focus will be in identifying salient regions to inform electrode reduction for future wearable deployment.",

<script>
const C = DATA.conference;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin = hm => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const fmt = min => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;
const TYPE = { talk: "Talk", insight: "3-minute talks", keynote: "Keynote", poster: "Posters", break: "Break",
               meal: "Food", ceremony: "", demo: "Demo", social: "Social" };
const MINOR = new Set(["break", "meal"]);
const ITEMS = DATA.items.map((it, i) => ({ ...it, i, s: toMin(it.start), e: it.end ? toMin(it.end) : 24 * 60 }));  // no end time: runs to the end of the day
const span = it => `${it.start}–${it.end}`;
const POSTERS = DATA.posters;
const TOPICS = Object.entries(C.poster_topics || {}).map(([code, name]) => ({ code, name }))
  .filter(t => POSTERS.some(p => p.topic === t.code));
if (POSTERS.some(p => !p.topic)) TOPICS.push({ code: "", name: "Other" });
const topicName = code => (TOPICS.find(t => t.code === code) || {}).name || "";
const range = list => list.length ? (list.length > 1 ? `${list[0].number}–${list[list.length - 1].number}` : list[0].number) : "";
const KEY = "onear2026_program";

// ---------- persistent state (per device) ----------
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const stars = new Set(saved.stars || []);
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ stars: [...stars], theme: saved.theme })); } catch (e) {} }
if (saved.theme) document.documentElement.dataset.theme = saved.theme;

// ---------- clock ----------
// One-day event: "before" / "day" / "after" from the device date. For checking the
// day in advance, open the file with ?at=10:20 to pretend it is that time on the day.
const AT = (new URLSearchParams(location.search).get("at") || "").match(/^(\d{1,2}):(\d{2})$/);
function phase() {
  if (AT) return "day";
  const t = new Date().toLocaleDateString("en-CA");
  return t < C.date ? "before" : t > C.date ? "after" : "day";
}
function nowMin() {
  if (AT) return +AT[1] * 60 + +AT[2];
  const d = new Date(); return d.getHours() * 60 + d.getMinutes();
}
const state = { tab: phase() === "day" ? "now" : "program", q: "", topic: null };

// ---------- rendering helpers ----------
function authorsHTML(t) {
  if (!t.authors) return t.presenter ? `<p class="authors"><b>${esc(t.presenter)}</b>${t.affiliation ? " · " + esc(t.affiliation) : ""}</p>` : "";
  const a = t.authors.map(x => (x.presenter ? `<b>${esc(x.name)}</b>` : esc(x.name)) +
    (x.affils.length ? `<sup>${x.affils.join(",")}</sup>` : "")).join(", ");
  const f = t.affiliations.map((x, i) => `<li><sup>${i + 1}</sup> ${esc(x)}</li>`).join("");
  return `<p class="authors">${a}</p><ol class="affils">${f}</ol>`;
}
function talkLine(t) {
  if (t.kind === "tba") return `<span class="tba">To be announced</span>`;
  return `${esc(t.title)} – <b>${esc(t.presenter)}</b>`;
}
function cardHTML(it, opts = {}) {
  const minor = MINOR.has(it.type);
  let sub = "";
  if (it.type === "keynote" && it.talks[0] && it.talks[0].kind === "keynote") {
    sub = `<div class="ttl">${esc(it.talks[0].title)}</div><div class="sub"><b>${esc(it.talks[0].presenter)}</b></div>`;
  } else if (it.talks.length === 1) {
    const t = it.talks[0];
    sub = t.kind === "tba" ? `<div class="sub tba">Speaker to be announced</div>`
      : `<div class="ttl">${esc(t.title)}</div><div class="sub"><b>${esc(t.presenter)}</b></div>`;
  } else if (it.talks.length > 1) {
    sub = it.talks.map(t => t.kind === "tba" ? `<div class="sub">${talkLine(t)}</div>`
      : `<div class="mini"><div class="mttl">${esc(t.title)}</div><div class="sub"><b>${esc(t.presenter)}</b></div></div>`).join("");
  } else if (it.type === "poster") {
    sub = `<div class="sub">${POSTERS.length} posters</div>`;
  } else if (it.type === "social" && it.description) {
    sub = `<div class="sub">${esc(it.description)}</div>`;
  }
  const showTitle = !(it.type === "talk" && it.talks.length === 1 && it.talks[0].kind !== "tba") && it.type !== "keynote";
  const label = it.type === "keynote" ? it.title : (TYPE[it.type] || "");
  return `<button type="button" class="card t-${esc(it.type)} ${minor ? "minor" : ""} ${opts.live ? "live" : ""}" data-item="${it.i}">
    <div class="time">${span(it)}${label && !minor ? ` · <span class="type">${esc(label)}</span>` : ""}</div>
    ${showTitle ? `<div class="ttl">${esc(it.title)}</div>` : ""}${sub}</button>`;
}

function renderNow() {
  let h = C.draft ? `<div class="banner">${esc(C.draft_banner)}</div>` : "";
  const ph = phase();
  if (ph !== "day") {
    h += ph === "before"
      ? `<div class="notday"><h2>See you on ${esc(C.date_label.replace(/, \d{4}$/, ""))}</h2>
         <p>${esc(C.venue)}</p><p>This page shows what’s happening live during the day.</p></div>
         <div class="sect next"><span class="dot"></span><h3>First up · ${ITEMS[0].start}</h3></div>${cardHTML(ITEMS[0])}`
      : `<div class="notday"><h2>Thanks for coming!</h2><p>${esc(C.short)} took place on ${esc(C.date_label)}.</p></div>`;
    h += sponsorsHTML();
    $("#view-now").innerHTML = h;
    bindCards("#view-now");
    return;
  }
  const now = nowMin();
  const cur = ITEMS.filter(it => it.s <= now && now < it.e);
  const fut = ITEMS.filter(it => it.s > now);
  const nextS = fut.length ? Math.min(...fut.map(i => i.s)) : null;
  const next = fut.filter(i => i.s === nextS);
  h += `<div class="clock"><div><div class="lbl">Now</div><div class="val">${fmt(now)}</div></div><span class="chip live">LIVE</span></div>`;
  if (cur.length) {
    h += `<div class="sect"><span class="dot"></span><h3>Happening now</h3></div>` + cur.map(it => cardHTML(it, { live: true })).join("");
  } else {
    const first = ITEMS[0].s, last = Math.max(...ITEMS.map(i => i.e));
    h += `<div class="empty">${now < first ? "The day hasn’t started yet." : now >= last ? "That’s a wrap – thanks for coming!" : "Nothing scheduled right now."}</div>`;
  }
  if (next.length) h += `<div class="sect next"><span class="dot"></span><h3>Up next · ${next[0].start}</h3></div>` + next.map(it => cardHTML(it)).join("");
  $("#view-now").innerHTML = h;
  bindCards("#view-now");
}

function sponsorsHTML() {
  const list = C.sponsors || [];
  if (!list.length && !C.draft) return "";
  const tiles = list.length ? list.map(sp => {
    const inner = (sp.logo_src ? `<img src="${sp.logo_src}" alt="${esc(sp.name)}">` : esc(sp.name)) + (sp.note ? `<small>${esc(sp.note)}</small>` : "");
    return sp.url ? `<a class="stile" href="${esc(sp.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="stile">${inner}</div>`;
  }).join("") : `<div class="stile ph">Sponsor logo</div>`.repeat(4);
  const text = (C.sponsor_text || []).map(t => `<li>${esc(t)}</li>`).join("");
  return `<section class="sponsors" aria-label="Sponsors"><h3>${esc(C.sponsor_heading || "Sponsors")}</h3><div class="sgrid">${tiles}</div>
    ${text ? `<ul class="stext">${text}</ul>` : ""}
    ${list.length ? "" : `<p class="note">Placeholder – sponsors are added in program/conference.json</p>`}</section>`;
}
function renderProgram() {
  const now = phase() === "day" ? nowMin() : -1;  // dim/outline items only on the day
  let h = C.draft ? `<div class="banner">${esc(C.draft_banner)}</div>` : "";
  h += `<div class="prog-head"><h2>${esc(C.date_label)}</h2><p>${esc(C.venue)}${C.city ? ", " + esc(C.city) : ""}</p>
        <p>${[C.organizer ? esc(C.organizer) : "", C.website ? `<a href="${esc(C.website)}" target="_blank" rel="noopener">${esc(C.website.replace(/^https?:\/\/(www\.)?|\/$/g, ""))}</a>` : ""].filter(Boolean).join(" · ")}</p></div>`;
  h += ITEMS.map(it => `<div class="row-t ${it.e <= now ? "past" : ""}"><div class="st">${it.start}</div><div>${cardHTML(it, { live: it.s <= now && now < it.e })}</div></div>`).join("");
  h += sponsorsHTML();
  $("#view-program").innerHTML = h;
  bindCards("#view-program");
}

// ---------- posters ----------
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
POSTERS.forEach(p => {
  p._t = norm(p.title); p._a = norm(p.authors.map(a => a.name).join(" ")); p._f = norm(p.affiliations.join(" ")); p._b = norm(p.abstract);
});
function search(q) {
  const terms = norm(q).split(/[^a-z0-9-]+/).filter(t => t.length > 1);
  if (!terms.length) return POSTERS.map(p => ({ p, score: 0 }));
  const out = [];
  for (const p of POSTERS) {
    let score = 0, all = true;
    for (const t of terms) {
      const s = (p._t.includes(t) ? 5 : 0) + (p._a.includes(t) ? 4 : 0) + (p._f.includes(t) ? 2 : 0) + (p._b.includes(t) ? 1 : 0)
              + (p.number.toLowerCase() === t ? 10 : 0);
      if (!s) { all = false; break; }
      score += s;
    }
    if (all) out.push({ p, score });
  }
  return out.sort((a, b) => b.score - a.score);
}
function hl(text, q) {
  let h = esc(text);
  const terms = norm(q).split(/[^a-z0-9-]+/).filter(t => t.length > 1);
  if (!terms.length) return h;
  // highlight on the accent-free text, map positions back (same length for most Latin text)
  const n = norm(text);
  if (n.length !== text.length) return h;
  const marks = new Array(text.length).fill(false);
  terms.forEach(t => { let i = n.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + 1); } });
  let out = "", on = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !on) { out += "<mark>"; on = true; } else if (!marks[i] && on) { out += "</mark>"; on = false; }
    out += esc(text[i]);
  }
  return out + (on ? "</mark>" : "");
}
function posterRow(p, q = "", showTopic = false) {
  const on = stars.has(p.id);
  return `<div class="prow"><button type="button" class="main" data-poster="${esc(p.id)}">
      <div class="pnum">${esc(p.number)}</div><div class="ttl">${hl(p.title, q)}</div>
      <div class="sub">${hl(p.presenter, q)}${p.affiliations[0] ? " · " + esc(p.affiliations[0]) : ""}</div>
      ${showTopic && topicName(p.topic) ? `<div class="ptopic">${esc(topicName(p.topic))}</div>` : ""}
      ${p.talk_time ? `<div class="ptopic">Also a 3-minute talk at ${esc(p.talk_time)}</div>` : ""}</button>
    <button type="button" class="star ${on ? "on" : ""}" data-star="${esc(p.id)}" aria-pressed="${on}" aria-label="${on ? "Remove from" : "Add to"} my list">${on ? "★" : "☆"}</button></div>`;
}
function renderPosters() {
  if (!$("#pq")) {
    $("#view-posters").innerHTML = `${C.draft ? `<div class="banner">${esc(C.draft_banner)}</div>` : ""}
      <div class="search"><div class="box"><input id="pq" type="search" placeholder="Search posters: topic, name, institution…" aria-label="Search posters" autocomplete="off">
      <button class="clr" id="pqClr" type="button" aria-label="Clear search">✕</button></div></div>
      ${TOPICS.length > 1 ? `<div class="chips" id="pchips" role="group" aria-label="Filter by topic"></div>` : ""}
      <p class="hint" id="phint"></p><div id="presults"></div>`;
    $("#pq").oninput = e => { state.q = e.target.value; updatePosters(); };
    $("#pqClr").onclick = () => { state.q = ""; $("#pq").value = ""; updatePosters(); $("#pq").focus(); };
  }
  updatePosters();
}
function updatePosters() {
  const chips = $("#pchips");
  if (chips) {
    chips.innerHTML = [{ code: null, name: "All" }, ...TOPICS].map(t => {
      const n = t.code === null ? POSTERS.length : POSTERS.filter(p => p.topic === t.code).length;
      return `<button type="button" data-topic="${t.code ?? "*"}" aria-pressed="${state.topic === t.code}">${esc(t.name)}<small>${n}</small></button>`;
    }).join("");
    chips.querySelectorAll("button").forEach(b => b.onclick = () => {
      state.topic = b.dataset.topic === "*" ? null : b.dataset.topic; updatePosters();
    });
  }
  const q = state.q.trim();
  const res = search(state.q).filter(r => state.topic === null || r.p.topic === state.topic);
  const where = state.topic === null ? "" : ` in “${topicName(state.topic)}”`;
  $("#phint").textContent = q ? `${res.length} poster${res.length === 1 ? "" : "s"} match${res.length === 1 ? "es" : ""}${where}`
    : `${res.length} posters${where} · tap ☆ to add one to My List`;
  let h;
  if (!res.length) h = `<div class="empty">No posters match “${esc(state.q)}”${esc(where)}.</div>`;
  else if (q) h = res.map(r => posterRow(r.p, state.q, true)).join("");   // ranked list, topic shown per row
  else h = TOPICS.filter(t => state.topic === null || t.code === state.topic).map(t => {
    const list = res.map(r => r.p).filter(p => p.topic === t.code);
    return list.length ? `<h3 class="tgroup">${esc(t.name)}<span>${range(list)}</span></h3>` + list.map(p => posterRow(p)).join("") : "";
  }).join("");
  $("#presults").innerHTML = h;
  bindPosterRows("#presults");
}

// ---------- my list ----------
function listText() {
  return POSTERS.filter(p => stars.has(p.id)).map(p => `${p.number} – ${p.title}\n   ${p.presenter}${p.affiliations[0] ? " (" + p.affiliations[0] + ")" : ""}`).join("\n\n");
}
function renderList() {
  const mine = POSTERS.filter(p => stars.has(p.id));
  let h = `<div class="sect"><h3>My posters (${mine.length})</h3></div>`;
  if (!mine.length) {
    h += `<div class="empty">No posters yet. Find posters in the <button type="button" class="linkbtn" data-goto="posters">Posters</button> tab and tap ☆ to add them here.</div>`;
  } else {
    h += `<div class="actions"><button type="button" class="btn primary" id="emailBtn">Email me this list</button>
          <button type="button" class="btn" id="copyBtn">Copy</button><button type="button" class="btn" id="clearBtn">Clear</button></div>`;
    h += mine.map(p => posterRow(p)).join("");
  }
  $("#view-list").innerHTML = h;
  bindPosterRows("#view-list");
  const g = $("#view-list [data-goto]"); if (g) g.onclick = () => switchTab("posters");
  if (mine.length) {
    $("#emailBtn").onclick = () => {
      const body = `My posters – ${C.short} (${C.date_label})\n\n${listText()}\n`;
      location.href = `mailto:?subject=${encodeURIComponent(C.short + " – my posters")}&body=${encodeURIComponent(body)}`;
    };
    $("#copyBtn").onclick = () => {
      const t = listText();
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("List copied"), () => {
        const ta = document.createElement("textarea"); ta.value = t; document.body.append(ta); ta.select();
        try { document.execCommand("copy"); toast("List copied"); } catch (e) { toast("Copy failed"); } ta.remove();
      });
    };
    $("#clearBtn").onclick = () => { if (confirm("Remove all posters from your list?")) { stars.clear(); persist(); updateBadge(); renderList(); } };
  }
}
function updateBadge() { const b = $("#badge"); b.hidden = !stars.size; b.textContent = stars.size; }
function toggleStar(id) { stars.has(id) ? stars.delete(id) : stars.add(id); persist(); updateBadge(); }

// ---------- detail sheet ----------
function talkHTML(t) {
  if (t.kind === "tba") return `<div class="talk"><div class="slot">${t.slot.startsWith("M") ? "3-minute talk" : "Talk"}</div><p class="tba">Speaker to be announced</p></div>`;
  return `<div class="talk">${t.kind === "insight" ? `<div class="slot">3-minute insight talk</div>` : ""}
    <h4>${esc(t.title)}</h4>${authorsHTML(t)}${t.abstract ? `<p class="abstract">${esc(t.abstract)}</p>` : ""}
    ${t.poster ? `<p><button type="button" class="btn" data-open-poster="${esc(t.id)}">See poster ${esc(t.poster)}</button></p>` : ""}</div>`;
}
function openItem(it) {
  let h = `<div class="type t-${esc(it.type)}">${esc(it.type === "keynote" ? it.title : (TYPE[it.type] || ""))}</div>
    <h2 id="sheetTitle">${esc(it.type === "keynote" && it.talks[0]?.title ? it.talks[0].title : it.title)}</h2>
    <div class="meta">${esc(C.date_label)} · ${span(it)}</div>`;
  if (it.description) h += `<p>${esc(it.description)}</p>`;
  if (it.type === "keynote" && it.talks[0]?.kind === "keynote") {
    const k = it.talks[0];
    h += `<div class="talk">${authorsHTML(k)}${k.abstract ? `<p class="abstract">${esc(k.abstract)}</p>` : ""}</div>`;
  } else {
    h += it.talks.map(talkHTML).join("");
  }
  if (it.type === "poster") {
    h += `<div class="topics">` + TOPICS.map(t => {
      const list = POSTERS.filter(p => p.topic === t.code);
      return `<button type="button" class="btn" data-goto="posters" data-topic-go="${t.code}" style="text-align:left">${esc(t.name)} · ${list.length} posters (${range(list)})</button>`;
    }).join("") + `</div><p><button type="button" class="btn primary" data-goto="posters">Browse all ${POSTERS.length} posters</button></p>`;
  }
  showSheet(h);
}
function openPoster(p) {
  const on = stars.has(p.id);
  showSheet(`<div class="pnum">Poster ${esc(p.number)}${topicName(p.topic) ? ` · <span class="ptopic">${esc(topicName(p.topic))}</span>` : ""}</div><h2 id="sheetTitle">${esc(p.title)}</h2>
    ${authorsHTML(p)}${p.talk_time ? `<p><button type="button" class="btn" data-open-talk="${esc(p.slot)}">3-minute talk at ${esc(p.talk_time)}</button></p>` : ""}
    <p class="abstract">${esc(p.abstract)}</p>
    <p><button type="button" class="btn ${on ? "" : "primary"}" id="sheetStar">${on ? "★ In my list – remove" : "☆ Add to my list"}</button></p>`);
  $("#sheetStar").onclick = () => { toggleStar(p.id); openPoster(p); refreshLists(); };
}
let lastFocus = null;
function showSheet(html) {
  if (!$("#sheet").classList.contains("on")) lastFocus = document.activeElement;
  $("#sheetBody").innerHTML = html;
  if (!$("#sheet").classList.contains("on")) history.pushState({ tab: state.tab, sheet: true }, "", location.hash);
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); document.documentElement.classList.add("sheet-open"); $("#sheet").scrollTop = 0;
  $("#sheetBody").querySelectorAll("[data-goto]").forEach(b => b.onclick = () => {
    hideSheet();
    if (b.dataset.goto === "posters") { state.topic = "topicGo" in b.dataset ? b.dataset.topicGo : null; state.q = ""; const i = $("#pq"); if (i) i.value = ""; }
    switchTab(b.dataset.goto, "replace");  // the panel's history entry becomes the new tab, so Back returns to where you were
  });
  $("#sheetBody").querySelectorAll("[data-open-poster]").forEach(b => b.onclick = () => openPoster(POSTERS.find(p => p.id === b.dataset.openPoster)));
  $("#sheetBody").querySelectorAll("[data-open-talk]").forEach(b => b.onclick = () => openItem(ITEMS.find(it => it.talks.some(t => t.slot === b.dataset.openTalk))));
  $("#sheetClose").focus();
}
function hideSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); document.documentElement.classList.remove("sheet-open"); if (lastFocus) lastFocus.focus(); }
function closeSheet() {   // user closed the panel: undo its history entry (popstate then hides it)
  if (!$("#sheet").classList.contains("on")) return;
  if (history.state && history.state.sheet) history.back(); else hideSheet();
}
$("#sheetClose").onclick = closeSheet; $("#scrim").onclick = closeSheet;
// mouse wheel / trackpad beside the panel (wide screens) scrolls the panel, not the page behind it
$("#scrim").addEventListener("wheel", e => { e.preventDefault(); $("#sheet").scrollTop += e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY; }, { passive: false });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function bindCards(root) { document.querySelectorAll(`${root} [data-item]`).forEach(b => b.onclick = () => openItem(ITEMS[+b.dataset.item])); }
function bindPosterRows(root) {
  document.querySelectorAll(`${root} [data-poster]`).forEach(b => b.onclick = () => openPoster(POSTERS.find(p => p.id === b.dataset.poster)));
  document.querySelectorAll(`${root} [data-star]`).forEach(b => b.onclick = () => { toggleStar(b.dataset.star); refreshLists(); });
}
function refreshLists() { if (state.tab === "posters") updatePosters(); if (state.tab === "list") renderList(); }

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000); }

// ---------- tabs, theme, boot ----------
// Tabs are part of the browser history (#now, #program, …), so the browser/phone Back button works.
const TABS = ["now", "program", "posters", "list"];
function switchTab(tab, how = "push") {
  if (how === "push" && tab !== state.tab) history.pushState({ tab }, "", "#" + tab);
  if (how === "replace") history.replaceState({ tab }, "", "#" + tab);
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.tab === tab; t.classList.toggle("active", on); t.setAttribute("aria-selected", on); });
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  ({ now: renderNow, program: renderProgram, posters: renderPosters, list: renderList })[tab]();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { hideSheet(); switchTab(t.dataset.tab); });
window.addEventListener("popstate", e => {
  if ($("#sheet").classList.contains("on")) hideSheet();
  const tab = (e.state && e.state.tab) || location.hash.slice(1);
  if (TABS.includes(tab) && tab !== state.tab) switchTab(tab, "none");
});
// keep the sticky search box just below the (sticky) header, whatever its height
const setHeadH = () => document.documentElement.style.setProperty("--head-h", $("#head").offsetHeight + "px");
new ResizeObserver(setHeadH).observe($("#head"));
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  saved.theme = dark ? "light" : "dark"; document.documentElement.dataset.theme = saved.theme; persist();
};
/* Header uses the same Logo_v3.png and ON-EAR branding as index.html. */
updateBadge();
if (TABS.includes(location.hash.slice(1))) state.tab = location.hash.slice(1);
switchTab(state.tab, "replace");
setInterval(() => { if (phase() === "day" && (state.tab === "now" || state.tab === "program")) ({ now: renderNow, program: renderProgram })[state.tab](); }, 30000);
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./onear-sw.js').catch(() => {}));
}
</script>
